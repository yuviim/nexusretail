name: Deploy Frontend to S3/CloudFront

on:
  push:
    branches: [main]
    paths:
      - 'services/web/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  AWS_REGION: eu-central-1
  # Deployment-specific, not something a workflow file can know ahead of
  # time (S3_BUCKET depends on aws_account_id/project_name/domain_name,
  # CLOUDFRONT_DISTRIBUTION_ID is assigned by AWS when Terraform creates
  # the distribution) — set as repository variables (Settings > Secrets and
  # variables > Actions > Variables) after `terraform apply`, from
  # `terraform output`. See infra/README.md.
  S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}

permissions:
  id-token: write   # required to mint the OIDC token for AssumeRoleWithWebIdentity
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/web/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        working-directory: services/web
        run: npm ci

      - name: Build
        working-directory: services/web
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_COGNITO_REGION: ${{ secrets.VITE_COGNITO_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_APP_CLIENT_ID: ${{ secrets.VITE_COGNITO_APP_CLIENT_ID }}

      - name: Sync to S3
        working-directory: services/web
        run: |
          aws s3 sync dist/ s3://$S3_BUCKET/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
